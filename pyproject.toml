[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opticargo_knowledge_graph"
version = "0.1.0"
description = "Query library and schema definitions for OptiCargo AI Neo4j Knowledge Graph"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.21.0",
    "pydantic>=2.0.0",
    "opticargo-shared==1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "flake8>=6.0"]
