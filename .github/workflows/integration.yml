name: Knowledge Graph Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.21.2-community
        env:
          NEO4J_AUTH: neo4j/integration-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: opticargo-knowledge-graph
      - uses: actions/checkout@v4
        with:
          repository: Project-OptiCargo-Tol-Laut/opticargo-shared
          ref: develop
          path: opticargo-shared
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install ./opticargo-shared
          python -m pip install -e './opticargo-knowledge-graph[dev]'
      - name: Integration tests
        working-directory: opticargo-knowledge-graph
        env:
          OPTICARGO_INTEGRATION: "1"
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: integration-password
        run: pytest -q tests/integration
