services:
  graph-worker:
    build:
      context: ..
      dockerfile: opticargo-knowledge-graph/Dockerfile
    image: ghcr.io/opticargo-ai/opticargo-knowledge-graph:dev
    command: python -m opticargo_knowledge_graph.worker
    environment:
      OPTICARGO_ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://opticargo:opticargo@postgres:5432/opticargo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      GRAPH_CONSUMER_GROUP: ${GRAPH_CONSUMER_GROUP:-graph-sync}
